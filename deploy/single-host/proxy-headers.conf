# Public browser headers only. Locations overriding proxy_set_header must
# include this file again because Nginx does not merge inherited header sets.
proxy_set_header Host $http_host;
proxy_set_header Accept $http_accept;
proxy_set_header Content-Type $http_content_type;
proxy_set_header Origin $http_origin;
proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
proxy_set_header Cookie $http_cookie;
proxy_set_header X-CSRF-Token $http_x_csrf_token;
proxy_set_header If-Match $http_if_match;
proxy_set_header Idempotency-Key $http_idempotency_key;
proxy_set_header X-Request-ID $request_id;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header Connection "";
