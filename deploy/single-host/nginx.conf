# Install in http {}. New handlers are not automatically public routes.
map "$request_method:$uri" $ontology_api_allowed {
    default 0;
    ~^GET:/api/metadata/(capabilities|categories|groups|definitions|resolve|callables|callables/[a-zA-Z0-9_-]+|definitions/[a-zA-Z0-9_-]+(/draft)?|publications/[a-zA-Z0-9_-]+|schemas/[a-zA-Z0-9_-]+/links)$ 1;
    ~^POST:/api/metadata/(categories|groups|definitions|definitions/[a-zA-Z0-9_-]+/(preview|publish))$ 1;
    ~^PUT:/api/metadata/definitions/[a-zA-Z0-9_-]+/draft$ 1;
    ~^GET:/api/metadata/auth/(session|connections)$ 1;
    ~^POST:/api/metadata/auth/(login|logout|connections|oauth/(preview|authorize))$ 1;
    ~^PUT:/api/metadata/auth/password$ 1;
    ~^DELETE:/api/metadata/auth/connections/[a-zA-Z0-9_-]+$ 1;
    ~^GET:/api/metadata/admin/((users|roles|user-groups)(/[a-zA-Z0-9_-]+)?|policy|audit)$ 1;
    ~^POST:/api/metadata/admin/(users|roles|user-groups|simulate|policy/publish)$ 1;
    ~^PUT:/api/metadata/admin/((users|roles|user-groups)/[a-zA-Z0-9_-]+|policy)$ 1;
    ~^GET:/api/data/(capabilities|source-versions|sources(/[a-zA-Z0-9_-]+(/(overview|tables)(/[^/]+)?)?)?|query/context|schemas/[a-zA-Z0-9_-]+/(storage-mapping|form|instances/[a-zA-Z0-9_-]+)|links/[a-zA-Z0-9_-]+/instances)$ 1;
    ~^POST:/api/data/(sources(/(test|[a-zA-Z0-9_-]+/(test|query|sql/(analyze|format))))?|query(/ontology-sql(/(analyze|complete|format|insert-field|paths))?)?|schemas/[a-zA-Z0-9_-]+/instances|links/[a-zA-Z0-9_-]+/instances)$ 1;
    ~^PUT:/api/data/sources/[a-zA-Z0-9_-]+$ 1;
    ~^(PATCH|DELETE):/api/data/schemas/[a-zA-Z0-9_-]+/instances/[a-zA-Z0-9_-]+$ 1;
    ~^DELETE:/api/data/links/[a-zA-Z0-9_-]+/instances/[a-zA-Z0-9_-]+$ 1;
    ~^GET:/api/execution/(capabilities|invocations/[a-zA-Z0-9_-]+)$ 1;
    ~^POST:/api/execution/(source-tools|invocations)$ 1;
    ~^GET:/api/ontoapp-ontology/metadata/(auth/session|definitions/[a-zA-Z0-9_-]+)$ 1;
    ~^POST:/api/ontoapp-ontology/metadata/auth/(login|logout)$ 1;
    ~^GET:/api/ontoapp-ontology/data/(query/context|schemas/[a-zA-Z0-9_-]+/(form|instances/[a-zA-Z0-9_-]+))$ 1;
    ~^POST:/api/ontoapp-ontology/data/(query|schemas/[a-zA-Z0-9_-]+/instances)$ 1;
    ~^(PATCH|DELETE):/api/ontoapp-ontology/data/schemas/[a-zA-Z0-9_-]+/instances/[a-zA-Z0-9_-]+$ 1;
    ~^GET:/api/ontoapp/(workspace|ai/status)$ 1;
    ~^PUT:/api/ontoapp/workspace$ 1;
    ~^POST:/api/ontoapp/(workspace/publish|ai/generate)$ 1;
}
map $request_uri $ontology_original_api_path {
    default "";
    # Match normalized paths above, preserve original escaping and args here.
    ~^/api/ontoapp/ $request_uri;
    ~^/api/(ontoapp-ontology/)?(?<ontology_forward_path>(metadata|data|execution)/.*)$ /$ontology_forward_path;
}
map $uri $ontology_form_path {
    default "";
    ~^/api/ontoapp-ontology/metadata/definitions/(?<ontology_form_id>[a-zA-Z0-9_-]+)$ /data/schemas/$ontology_form_id/form;
}
map $ontology_form_path $ontology_api_path {
    default $ontology_form_path$is_args$args;
    "" $ontology_original_api_path;
}
map $ontology_api_path $ontology_backend {
    default "";
    ~^/metadata/ http://127.0.0.1:18080;
    ~^/data/ http://127.0.0.1:18081;
    ~^/execution/ http://127.0.0.1:18082;
    ~^/api/ontoapp/ http://127.0.0.1:18083;
}
map $uri $ontology_login_key {
    default "";
    ~^/api/(ontoapp-ontology/)?metadata/auth/login$ $binary_remote_addr;
}
map $http_authorization $ontology_mcp_authorization {
    default "";
    "~^Bearer mcp_[A-Za-z0-9_-]+$" $http_authorization;
}
limit_req_zone $binary_remote_addr zone=ontology_api:1m rate=20r/s;
limit_req_zone $ontology_login_key zone=ontology_login:1m rate=1r/s;
limit_req_zone $binary_remote_addr zone=ontology_register:1m rate=1r/m;
limit_req_zone $binary_remote_addr zone=ontology_oauth:1m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=ontology_connections:1m;
# Do not log targets, args, headers, bodies, credentials or results.
log_format ontology_privacy '$request_id $remote_addr $request_method $status $request_time';

server {
    listen 30011 ssl;
    listen [::]:30011 ssl;
    server_name 47.100.85.94;
    if ($http_host != "47.100.85.94:30011") { return 444; }
    ssl_certificate /etc/agentforge-ontology/tls/server.crt;
    ssl_certificate_key /etc/agentforge-ontology/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    error_page 497 =301 https://47.100.85.94:30011$request_uri;

    root /var/lib/agentforge-ontology/current/web;
    index index.html;
    client_max_body_size 8m;
    client_body_buffer_size 128k;
    client_body_timeout 20s;
    client_header_timeout 10s;
    send_timeout 30s;
    include /etc/agentforge-ontology/nginx-security-headers.conf;
    server_tokens off;
    access_log /var/log/nginx/ontology-access.log ontology_privacy;
    # Error records can append request URLs; use privacy access status/timing.
    error_log /dev/null crit;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req zone=ontology_api burst=40 nodelay;
    limit_conn ontology_connections 20;

    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    include /etc/agentforge-ontology/nginx-proxy-headers.conf;
    proxy_set_header Authorization "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;
    proxy_send_timeout 20s;
    proxy_cache off;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;
    error_page 400 414 = @ontology_bad_request;
    error_page 403 = @ontology_forbidden;
    error_page 404 405 = @ontology_not_found;
    error_page 413 = @ontology_too_large;
    error_page 429 = @ontology_busy;
    error_page 502 503 504 = @ontology_unavailable;

    location /api/ {
        default_type application/json;
        if ($ontology_api_allowed = 0) { return 404 '{"code":"not_found","message":"接口或方法未开放"}'; }
        if ($ontology_backend = "") { return 404 '{"code":"not_found","message":"接口未开放"}'; }
        limit_req zone=ontology_api burst=40 nodelay;
        limit_req zone=ontology_login burst=10 nodelay;
        add_header Cache-Control no-store always;
        include /etc/agentforge-ontology/nginx-security-headers.conf;
        # OntoApp AI enforces its own deadline; other services also bound work.
        proxy_read_timeout 100s;
        proxy_pass $ontology_backend$ontology_api_path;
    }
    location = /mcp {
        limit_except GET POST DELETE { deny all; }
        include /etc/agentforge-ontology/nginx-proxy-headers.conf;
        proxy_set_header Authorization $ontology_mcp_authorization;
        proxy_set_header MCP-Protocol-Version $http_mcp_protocol_version;
        proxy_set_header MCP-Session-Id $http_mcp_session_id;
        proxy_set_header Last-Event-ID $http_last_event_id;
        add_header Cache-Control no-store always;
        include /etc/agentforge-ontology/nginx-security-headers.conf;
        proxy_pass http://127.0.0.1:18084;
    }
    location = /.well-known/oauth-protected-resource { limit_except GET { deny all; } proxy_pass http://127.0.0.1:18084; }
    location = /.well-known/oauth-protected-resource/mcp { limit_except GET { deny all; } proxy_pass http://127.0.0.1:18084; }
    location = /.well-known/oauth-authorization-server { limit_except GET { deny all; } proxy_pass http://127.0.0.1:18080; }
    location = /oauth/authorize { limit_except GET { deny all; } proxy_pass http://127.0.0.1:18080; }
    location = /oauth/register { limit_except POST { deny all; } limit_req zone=ontology_register burst=4 nodelay; proxy_pass http://127.0.0.1:18080; }
    location = /oauth/token { limit_except POST { deny all; } limit_req zone=ontology_oauth burst=10 nodelay; proxy_pass http://127.0.0.1:18080; }
    location = /oauth/revoke { limit_except POST { deny all; } limit_req zone=ontology_oauth burst=10 nodelay; proxy_pass http://127.0.0.1:18080; }
    location /oauth/ { return 404; }
    location /internal/ { return 404; }
    # Optional OntoApp artifact, maintained and deployed by its own repository.
    location /ontoapp/ {
        if (!-f /var/lib/ontoapp/current/site/ontoapp/index.html) { return 503; }
        limit_except GET { deny all; }
        root /var/lib/ontoapp/current/site;
        try_files $uri $uri/ /ontoapp/index.html;
        add_header Cache-Control no-store always;
        include /etc/agentforge-ontology/nginx-security-headers.conf;
    }
    location ~ (^|/)\. { return 404; }
    location ~* \.(map|env|sql|log)$ { return 404; }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/agentforge-ontology/nginx-security-headers.conf;
    }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control no-cache; include /etc/agentforge-ontology/nginx-security-headers.conf; }
    location @ontology_bad_request { default_type application/json; add_header Cache-Control no-store always; include /etc/agentforge-ontology/nginx-security-headers.conf; return 400 '{"code":"invalid_request","message":"请求格式无效"}'; }
    location @ontology_forbidden { default_type application/json; add_header Cache-Control no-store always; include /etc/agentforge-ontology/nginx-security-headers.conf; return 403 '{"code":"forbidden","message":"请求未开放"}'; }
    location @ontology_not_found { default_type application/json; add_header Cache-Control no-store always; include /etc/agentforge-ontology/nginx-security-headers.conf; return 404 '{"code":"not_found","message":"接口或资源未开放"}'; }
    location @ontology_too_large { default_type application/json; add_header Cache-Control no-store always; include /etc/agentforge-ontology/nginx-security-headers.conf; return 413 '{"code":"request_too_large","message":"请求正文超过入口预算"}'; }
    location @ontology_busy { default_type application/json; add_header Cache-Control no-store always; add_header Retry-After 1 always; include /etc/agentforge-ontology/nginx-security-headers.conf; return 429 '{"code":"service_busy","message":"请求较多，请稍后重试"}'; }
    location @ontology_unavailable { default_type application/json; add_header Cache-Control no-store always; include /etc/agentforge-ontology/nginx-security-headers.conf; return 503 '{"code":"service_unavailable","message":"服务暂不可用，请稍后重试"}'; }
}
