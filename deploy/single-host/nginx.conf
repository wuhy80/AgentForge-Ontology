server {
    listen 30011 ssl;
    listen [::]:30011 ssl;
    server_name 47.100.85.94;
    ssl_certificate /etc/agentforge-ontology/tls/server.crt;
    ssl_certificate_key /etc/agentforge-ontology/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    error_page 497 =301 https://$host:30011$request_uri;

    root /var/lib/agentforge-ontology/current/web;
    index index.html;
    client_max_body_size 8m;
    add_header X-Content-Type-Options nosniff always;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;

    location /api/metadata/ { proxy_pass http://127.0.0.1:18080/metadata/; }
    location /api/data/ { proxy_pass http://127.0.0.1:18081/data/; }
    location /api/execution/ { proxy_pass http://127.0.0.1:18082/execution/; }
    location = /mcp {
        proxy_pass http://127.0.0.1:18084;
        proxy_buffering off;
        proxy_request_buffering off;
    }
    location = /.well-known/oauth-protected-resource { proxy_pass http://127.0.0.1:18084; }
    location = /.well-known/oauth-protected-resource/mcp { proxy_pass http://127.0.0.1:18084; }
    location = /.well-known/oauth-authorization-server { proxy_pass http://127.0.0.1:18080; }
    location /oauth/ { proxy_pass http://127.0.0.1:18080; }
    location /internal/ { return 404; }
    # OntoApp 是独立应用，不随本体平台部署。
    location /ontoapp/ { return 503; }
    location /api/ontoapp { return 503; }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control no-cache; }
}
