apiVersion: v1
kind: Namespace
metadata:
  name: agentforge-infra
  labels:
    app.kubernetes.io/part-of: agentforge-local
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: agentforge-local-retain
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: agentforge-infra
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: agentforge-local-retain
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: agentforge-infra
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: agentforge-local-retain
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: influxdb-data
  namespace: agentforge-infra
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: agentforge-local-retain
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: agentforge-infra
data:
  redis.conf: |
    bind 0.0.0.0
    protected-mode yes
    port 6379
    dir /data
    appendonly yes
    appendfsync everysec
    save 900 1
    save 300 10
    maxmemory 256mb
    maxmemory-policy noeviction
    aclfile /run/redis-auth/users.acl
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: agentforge-infra
spec:
  clusterIP: None
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: agentforge-infra
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: mysql
          image: mysql:26.7.0
          imagePullPolicy: IfNotPresent
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_0900_ai_ci
            - --innodb-buffer-pool-size=536870912
            - --max-connections=100
          env:
            - name: MYSQL_DATABASE
              value: agentforge
            - name: MYSQL_USER
              value: agentforge
            - name: MYSQL_ROOT_HOST
              value: localhost
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-auth
                  key: root-password
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-auth
                  key: app-password
          ports:
            - name: mysql
              containerPort: 3306
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: '2'
              memory: 2Gi
          startupProbe:
            exec:
              command: [sh, -ec, 'MYSQL_PWD="$MYSQL_PASSWORD" mysql --protocol=tcp -h 127.0.0.1 -u agentforge -D agentforge -Nse "SELECT 1"']
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 90
          readinessProbe:
            exec:
              command: [sh, -ec, 'MYSQL_PWD="$MYSQL_PASSWORD" mysql --protocol=tcp -h 127.0.0.1 -u agentforge -D agentforge -Nse "SELECT 1"']
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 15
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mysql-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: agentforge-infra
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: agentforge-infra
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: redis
          image: redis:8.10.2
          imagePullPolicy: IfNotPresent
          args: [redis-server, /usr/local/etc/redis/redis.conf]
          env:
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          startupProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 15
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /usr/local/etc/redis
              readOnly: true
            - name: auth
              mountPath: /run/redis-auth
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
        - name: config
          configMap:
            name: redis-config
        - name: auth
          secret:
            secretName: redis-auth
---
apiVersion: v1
kind: Service
metadata:
  name: influxdb
  namespace: agentforge-infra
spec:
  clusterIP: None
  selector:
    app: influxdb
  ports:
    - name: http
      port: 8181
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: influxdb
  namespace: agentforge-infra
spec:
  serviceName: influxdb
  replicas: 1
  selector:
    matchLabels:
      app: influxdb
  template:
    metadata:
      labels:
        app: influxdb
    spec:
      terminationGracePeriodSeconds: 90
      securityContext:
        fsGroup: 1500
      containers:
        - name: influxdb
          image: influxdb:3.12.1-core
          imagePullPolicy: IfNotPresent
          args:
            - influxdb3
            - serve
            - --node-id=agentforge-local
            - --object-store=file
            - --data-dir=/var/lib/influxdb3/data
            - --http-bind=0.0.0.0:8181
            - --admin-token-file=/run/influxdb-auth/admin-token.json
            - --disable-authz=health,ping,ready
            - --exec-mem-pool-size=256mb
          env:
            - name: INFLUXDB3_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: influxdb-auth
                  key: admin-token
          ports:
            - name: http
              containerPort: 8181
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: '2'
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/influxdb3
            - name: auth
              mountPath: /run/influxdb-auth
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: influxdb-data
        - name: auth
          secret:
            secretName: influxdb-auth
