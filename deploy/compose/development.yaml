name: agentforge-ontology-dev
services:
  metadata-db:
    image: mysql:26.7.0
    environment:
      MYSQL_ROOT_PASSWORD: ${ONTOLOGY_MYSQL_ROOT_PASSWORD:?required}
      MYSQL_DATABASE: ontology_metadata
      MYSQL_USER: ontology
      MYSQL_PASSWORD: ${ONTOLOGY_MYSQL_PASSWORD:?required}
    ports: ["127.0.0.1:23306:3306"]
    volumes: ["metadata-db:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 30
  data-db:
    image: mysql:26.7.0
    environment:
      MYSQL_ROOT_PASSWORD: ${ONTOLOGY_MYSQL_ROOT_PASSWORD:?required}
      MYSQL_DATABASE: ontology_data
      MYSQL_USER: ontology
      MYSQL_PASSWORD: ${ONTOLOGY_MYSQL_PASSWORD:?required}
    ports: ["127.0.0.1:23307:3306"]
    volumes: ["data-db:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 30
  execution-db:
    image: mysql:26.7.0
    environment:
      MYSQL_ROOT_PASSWORD: ${ONTOLOGY_MYSQL_ROOT_PASSWORD:?required}
      MYSQL_DATABASE: ontology_execution
      MYSQL_USER: ontology
      MYSQL_PASSWORD: ${ONTOLOGY_MYSQL_PASSWORD:?required}
    ports: ["127.0.0.1:23308:3306"]
    volumes: ["execution-db:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 30
  source-postgres:
    image: postgres:17-alpine
    profiles: ["sources"]
    environment:
      POSTGRES_USER: ontology
      POSTGRES_DB: ontology_sources
      POSTGRES_PASSWORD: ${ONTOLOGY_SOURCE_POSTGRES_PASSWORD:?required}
    ports: ["127.0.0.1:25432:5432"]
    volumes: ["source-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontology -d ontology_sources"]
      interval: 3s
      timeout: 3s
      retries: 30
  opa:
    image: openpolicyagent/opa:1.21.2-static
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policy/ontology.rego", "/policy/data.example.json"]
    volumes: ["../opa:/policy:ro"]
    ports: ["127.0.0.1:28181:8181"]
volumes:
  metadata-db:
  data-db:
  execution-db:
  source-postgres:
