name: 构建 Linux 部署制品

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: 验证制品协议及部署脚本
        run: |
          python3 -m unittest discover -s scripts -p 'test_release_archive.py'
          bash -n scripts/server-dev.sh
      - name: 验证 Go 模块
        env:
          GOWORK: 'off'
        run: |
          set -euo pipefail
          for module in contracts libs/storage libs/platform services/metadata services/data services/execution services/mcp; do
            (cd "$module" && go test ./... && go vet ./...)
          done
      - name: 构建四服务及前端
        run: python3 scripts/build-release.py
      - name: 验证前端
        working-directory: apps/web
        run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: ontology-linux-amd64-${{ github.sha }}
          path: |
            .cache/artifacts/ontology-linux-amd64.tar.gz
            .cache/artifacts/ontology-linux-amd64.tar.gz.sha256
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
